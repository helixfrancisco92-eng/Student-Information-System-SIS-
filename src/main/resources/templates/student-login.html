<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Student Login</title>
  <link rel="stylesheet" href="css/login.css" />
</head>
<body>
  <div class="page">
    <div class="left-panel">
      <div class="left-overlay"></div>
    </div>

    <div class="right-panel">
      <div class="form-card">
        <h1 class="form-title">STUDENT LOGIN</h1>

        <div class="divider-row">
          <span class="divider-line"></span>
          <svg class="divider-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M22 10v6M2 10l10-5 10 5-10 5z"/>
            <path d="M6 12v5c3 3 9 3 12 0v-5"/>
          </svg>
          <span class="divider-line"></span>
        </div>

        <p class="form-subtitle">Welcome back! Please login to your account.</p>

        <div class="field-group">
          <label class="field-label" for="username">Username / ID Number</label>
          <div class="input-wrap">
            <svg class="input-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M8 7a4 4 0 1 0 8 0a4 4 0 0 0 -8 0"/>
              <path d="M6 21v-2a4 4 0 0 1 4-4h4a4 4 0 0 1 4 4v2"/>
            </svg>
            <input type="text" id="username" class="field-input" placeholder="Enter your username or ID" autocomplete="username" />
          </div>
        </div>

        <div class="field-group">
          <label class="field-label" for="password">Password</label>
          <div class="input-wrap">
            <svg class="input-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <rect x="5" y="11" width="14" height="10" rx="2"/>
              <path d="M12 16v2"/>
              <path d="M8 11V7a4 4 0 0 1 8 0v4"/>
            </svg>
            <input type="password" id="password" class="field-input" placeholder="Enter your password" autocomplete="current-password" />
          </div>
        </div>

        <div class="options-row">
          <label class="remember-label">
            <input type="checkbox" id="remember" class="remember-check" />
            <span class="toggle-track"><span class="toggle-thumb"></span></span>
            Remember me
          </label>
          <a href="#" class="forgot-link">Forgot Password?</a>
        </div>

        <button class="login-btn" onclick="handleLogin()">LOGIN</button>

        <div class="divider-row bottom">
          <span class="divider-line"></span>
          <svg class="divider-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M12 3a9 9 0 1 0 0 18A9 9 0 0 0 12 3z"/>
            <path d="M12 8v4l3 3"/>
            <path d="M9 3.6a9 9 0 0 0 0 16.8"/>
          </svg>
          <span class="divider-line"></span>
        </div>
      </div>
    </div>
  </div>

  <script src="js/login.js"></script>
</body>
</html>

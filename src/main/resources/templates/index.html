<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Welcome</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="welcome-wrap">
    <div class="blob tl1"></div>
    <div class="blob tl2"></div>
    <div class="blob tr1"></div>
    <div class="blob tr2"></div>
    <div class="blob bl1"></div>
    <div class="blob bl2"></div>
    <div class="blob br1"></div>
    <div class="blob br2"></div>

    <div class="center-content">
      <h1 class="welcome-title">Welcome!</h1>
      <div class="btn-row">
        <button class="role-btn btn-student" onclick="handleRole('student')">
          <svg class="icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M8 7a4 4 0 1 0 8 0a4 4 0 0 0 -8 0" />
            <path d="M6 21v-2a4 4 0 0 1 4 -4h4a4 4 0 0 1 4 4v2" />
          </svg>
          STUDENT
        </button>
        <button class="role-btn btn-admin" onclick="handleRole('admin')">
          <svg class="icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M10 13a2 2 0 1 0 4 0a2 2 0 0 0 -4 0" />
            <path d="M8 21v-1a2 2 0 0 1 2 -2h4a2 2 0 0 1 2 2v1" />
            <path d="M15 5a2 2 0 1 0 4 0a2 2 0 0 0 -4 0" />
            <path d="M17 10h2a2 2 0 0 1 2 2v1" />
            <path d="M5 5a2 2 0 1 0 4 0a2 2 0 0 0 -4 0" />
            <path d="M3 13v-1a2 2 0 0 1 2 -2h2" />
          </svg>
          ADMIN
        </button>
      </div>
    </div>
  </div>

  <script src="js/main.js"></script>
</body>
</html>
